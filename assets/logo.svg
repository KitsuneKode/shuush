<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shuush">
  <title>Shuush</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2521"/>
      <stop offset="1" stop-color="#1a1714"/>
    </linearGradient>
  </defs>
  <!-- keycap skirt -->
  <rect x="4" y="8" width="120" height="116" rx="30" fill="#0e0c0a"/>
  <!-- keycap face -->
  <rect x="10" y="6" width="108" height="104" rx="25" fill="url(#face)"/>
  <rect x="10.75" y="6.75" width="106.5" height="102.5" rx="24.25" fill="none" stroke="#f4eee1" stroke-opacity=".14" stroke-width="1.5"/>
  <!-- voice fading to quiet: three tapering bars, then the delivered dot -->
  <path d="M38 30v52M56 41v30M74 51v10" stroke="#f86649" stroke-width="11" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="56" r="7" fill="#6ae5b7"/>
</svg>
