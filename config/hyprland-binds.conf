# Shuush keybindings & window rules for Hyprland
# Source this file from ~/.config/hypr/hyprland.conf (or copy into your config).

# Dictation: toggle, push-to-talk / tap-hands-free, voice edit selection, cancel
bindd = SUPER CTRL, D, Dictation toggle, exec, shuush toggle
bindd = SUPER SHIFT, D, Cancel dictation, exec, shuush cancel now
bindd = SUPER CTRL, E, Voice command on selection, exec, shuush command
bindd = SUPER CTRL SHIFT, D, Teach dictation fix from clipboard, exec, shuush learn fix
bindd = SUPER CTRL ALT, D, Bring back dictation, exec, shuush recover
bindd = SUPER ALT, D, Open Shuush Studio, exec, shuush studio

# Push-to-talk (hold F9) or tap F9 (<300ms) for hands-free listening
bindd  = , F9, Dictation (hold or tap), exec, shuush hold
binddr = , F9, Dictation stop, exec, shuush release

# Floating centered Shuush Studio window (fits both 1440p/4K and 1080p HiDPI laptops)
windowrule = match:class ^(dev\.kitsunekode\.voxtype-studio)$, float on, center on, size (min(1140,monitor_w*0.92)) (min(720,monitor_h*0.86))

# Blur behind the KitsuneHud Quickshell pill
layerrule = match:namespace voxtype-osd, blur on, ignore_alpha 0.5
